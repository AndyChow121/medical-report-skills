name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: py${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # 额外覆盖一次 Windows，捕捉平台专属回归（路径 / 编码 / 换行）
          - os: windows-latest
            python-version: "3.13"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install . pytest python-docx

      # ---------- 1. 单元测试 ----------
      - name: Run unit tests
        run: pytest tests/ -q --tb=short

      # ---------- 2. CLI 冒烟 ----------
      - name: CLI smoke test
        run: |
          graph-interp --help
          graph-interp check
          graph-interp demo

      # ---------- 3. 端到端全样本自检 ----------
      - name: End-to-end verify (all bundled samples)
        run: graph-interp verify --cleanup

      # ---------- 4. JSON Schema 校验每个样本 ----------
      - name: Validate bundled samples against JSON Schema
        shell: bash
        run: |
          set -e
          for t in km forest roc box scatter bar heatmap volcano; do
            echo "::group::validate $t"
            graph-interp validate --data "scripts/sample_${t}.json" --type "$t"
            echo "::endgroup::"
          done

      # ---------- 5. diff 子命令冒烟（v1.6.0） ----------
      - name: diff subcommand smoke test
        run: |
          graph-interp diff roc_partial_ml roc_ml --type roc
          graph-interp diff km csco_km

      # ---------- 6. 构建 wheel 并校验资源打包 ----------
      - name: Build wheel
        run: |
          python -m pip install build
          python -m build --wheel

      - name: Verify wheel bundles samples and modules
        shell: bash
        run: |
          python - <<'PY'
          import glob
          import zipfile

          whl = sorted(glob.glob("dist/*.whl"))[-1]
          with zipfile.ZipFile(whl) as z:
              names = z.namelist()

          samples = [n for n in names if "sample_" in n]
          print(f"wheel: {whl}")
          print(f"bundled sample resources: {len(samples)}")

          # v1.5.0 起 sample 必须随 wheel 发布，否则 demo / verify 全废
          assert len(samples) >= 20, f"sample 资源未打进 wheel: {len(samples)}"

          for mod in (
              "scripts/_samples.py",
              "scripts/_schema.py",
              "scripts/_diff.py",
              "scripts/to_legend_docx.py",
              "scripts/tripod_ai_radar.py",
          ):
              assert mod in names, f"wheel 缺少模块 {mod}"

          print("wheel 内容校验通过")
          PY

      - name: Upload wheel artifact
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl
